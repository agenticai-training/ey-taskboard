name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            dir: backend-python
          - name: dotnet
            dir: backend-dotnet
          - name: java
            dir: backend-java
          - name: frontend
            dir: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.name == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pytest
        if: matrix.name == 'python'
        working-directory: backend-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      - name: Set up .NET
        if: matrix.name == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet test
        if: matrix.name == 'dotnet'
        working-directory: backend-dotnet
        run: dotnet test

      - name: Set up JDK
        if: matrix.name == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Maven test
        if: matrix.name == 'java'
        working-directory: backend-java
        run: ./mvnw -B test

      - name: Set up Node
        if: matrix.name == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm test
        if: matrix.name == 'frontend'
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run

  compose-smoke:
    name: compose smoke
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build --wait

      - name: Health and create/list task
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/api/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title":"ci-smoke"}'
          curl -fsS http://127.0.0.1:8000/api/tasks | grep -F 'ci-smoke'

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: publish images
    needs: compose-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set as repository secrets before publishing from main."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for pair in \
            "backend-python taskboard-python" \
            "backend-dotnet taskboard-dotnet" \
            "backend-java taskboard-java" \
            "frontend taskboard-frontend"
          do
            set -- $pair
            context=$1
            name=$2
            docker build -t "$DOCKERHUB_USER/$name:$SHA" -t "$DOCKERHUB_USER/$name:latest" "$context"
            docker push "$DOCKERHUB_USER/$name:$SHA"
            docker push "$DOCKERHUB_USER/$name:latest"
          done
